<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 120" width="450" height="120">
  <!-- Islamic Octagon Symbol -->
  <g transform="translate(330, 10)">
    <rect x="15" y="15" width="70" height="70" rx="4" stroke="#065f46" stroke-width="7" fill="#ffffff" />
    <rect x="15" y="15" width="70" height="70" rx="4" transform="rotate(45 50 50)" stroke="#047857" stroke-width="7" fill="#ffffff" />
    <polygon points="50,22 58,36 74,36 62,46 68,62 50,52 32,62 38,46 26,36 42,36" fill="#047857" opacity="0.25" />
    <circle cx="50" cy="50" r="14" fill="#ffffff" stroke="#065f46" stroke-width="2.5" />
    <circle cx="50" cy="40" r="2.8" fill="#0284c7" />
    <circle cx="58" cy="44" r="2.8" fill="#e11d48" />
    <circle cx="60" cy="52" r="2.8" fill="#f59e0b" />
    <circle cx="56" cy="60" r="2.8" fill="#16a34a" />
    <circle cx="44" cy="60" r="2.8" fill="#9333ea" />
    <circle cx="40" cy="52" r="2.8" fill="#0d9488" />
    <circle cx="42" cy="44" r="2.8" fill="#ea580c" />
    <circle cx="50" cy="50" r="3.5" fill="#065f46" />
  </g>

  <!-- Typography -->
  <g transform="translate(10, 20)">
    <!-- PERMATA KITA -->
    <text x="0" y="40" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="42" fill="#065f46" letter-spacing="-1">
      PERMATA KITA
    </text>
    <!-- Border Line -->
    <line x1="0" y1="52" x2="310" y2="52" stroke="#000000" stroke-width="2" />
    <line x1="0" y1="52" x2="0" y2="80" stroke="#000000" stroke-width="3" />
    <line x1="310" y1="52" x2="310" y2="80" stroke="#000000" stroke-width="3" />
    <line x1="0" y1="80" x2="310" y2="80" stroke="#000000" stroke-width="2" />
    
    <!-- Full Day School -->
    <text x="15" y="74" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="22" fill="#000000" letter-spacing="2">
      Full Day School
    </text>
    
    <!-- Centre of Islamic Education Service -->
    <text x="5" y="96" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="600" font-size="13" fill="#333333">
      Centre of Islamic Education Service
    </text>
  </g>
</svg>
