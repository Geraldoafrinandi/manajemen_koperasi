<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="540" height="140">
  <defs>
    <linearGradient id="logoEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>

  <!-- Islamic 8-Pointed Star Emblem (Left) -->
  <g transform="translate(10, 5) scale(0.65)">
    <rect x="35" y="35" width="130" height="130" rx="10" stroke="url(#logoEmerald)" stroke-width="12" fill="#ffffff" />
    <rect x="35" y="35" width="130" height="130" rx="10" transform="rotate(45 100 100)" stroke="url(#logoEmerald)" stroke-width="12" fill="#ffffff" />
    <circle cx="100" cy="100" r="52" fill="#f0fdf4" stroke="#10b981" stroke-width="2.5" />
    <circle cx="100" cy="100" r="42" fill="#ffffff" stroke="#047857" stroke-width="2" />
    
    <!-- Book/Crescent Top -->
    <g transform="translate(100, 62) scale(0.65)">
      <path d="M -3 -12 A 4 4 0 1 0 3 -12 A 3 3 0 1 1 -3 -12" fill="#047857" />
      <path d="M 0 0 C -6 -5 -14 -4 -18 -1 L -18 7 C -14 4 -6 3 0 8 C 6 3 14 4 18 7 L 18 -1 C 14 -4 6 -5 0 0 Z" fill="#059669" />
    </g>

    <!-- 8 Community Figures -->
    <g transform="translate(100, 106)">
      <g transform="rotate(0)"><circle cx="0" cy="-24" r="4.5" fill="#0284c7" /><path d="M -7 -17 C -5 -21 5 -21 7 -17 C 8 -13 4 -10 0 -9 C -4 -10 -8 -13 -7 -17 Z" fill="#0284c7" /></g>
      <g transform="rotate(45)"><circle cx="0" cy="-24" r="4.5" fill="#2563eb" /><path d="M -7 -17 C -5 -21 5 -21 7 -17 C 8 -13 4 -10 0 -9 C -4 -10 -8 -13 -7 -17 Z" fill="#2563eb" /></g>
      <g transform="rotate(90)"><circle cx="0" cy="-24" r="4.5" fill="#ea580c" /><path d="M -7 -17 C -5 -21 5 -21 7 -17 C 8 -13 4 -10 0 -9 C -4 -10 -8 -13 -7 -17 Z" fill="#ea580c" /></g>
      <g transform="rotate(135)"><circle cx="0" cy="-24" r="4.5" fill="#f59e0b" /><path d="M -7 -17 C -5 -21 5 -21 7 -17 C 8 -13 4 -10 0 -9 C -4 -10 -8 -13 -7 -17 Z" fill="#f59e0b" /></g>
      <g transform="rotate(180)"><circle cx="0" cy="-24" r="4.5" fill="#10b981" /><path d="M -7 -17 C -5 -21 5 -21 7 -17 C 8 -13 4 -10 0 -9 C -4 -10 -8 -13 -7 -17 Z" fill="#10b981" /></g>
      <g transform="rotate(225)"><circle cx="0" cy="-24" r="4.5" fill="#0d9488" /><path d="M -7 -17 C -5 -21 5 -21 7 -17 C 8 -13 4 -10 0 -9 C -4 -10 -8 -13 -7 -17 Z" fill="#0d9488" /></g>
      <g transform="rotate(270)"><circle cx="0" cy="-24" r="4.5" fill="#9333ea" /><path d="M -7 -17 C -5 -21 5 -21 7 -17 C 8 -13 4 -10 0 -9 C -4 -10 -8 -13 -7 -17 Z" fill="#9333ea" /></g>
      <g transform="rotate(315)"><circle cx="0" cy="-24" r="4.5" fill="#e11d48" /><path d="M -7 -17 C -5 -21 5 -21 7 -17 C 8 -13 4 -10 0 -9 C -4 -10 -8 -13 -7 -17 Z" fill="#e11d48" /></g>
      <circle cx="0" cy="0" r="9" fill="#ffffff" stroke="#047857" stroke-width="2.5" />
      <circle cx="0" cy="0" r="3" fill="#047857" />
    </g>
  </g>

  <!-- Typography (Right) -->
  <g transform="translate(150, 48)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="34" fill="#065f46" letter-spacing="-1">
      KOPERASI PERMATA KITA
    </text>
    <text x="0" y="28" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="16" fill="#047857" letter-spacing="1">
      SD IT PERMATA • FULL DAY SCHOOL
    </text>
    <text x="0" y="48" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="600" font-size="12" fill="#64748b">
      Centre of Islamic Education Service
    </text>
  </g>
</svg>
